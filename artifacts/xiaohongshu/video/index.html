<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>看见成长，遇见伙伴</title><script src="gsap.min.js"></script><style>@font-face{font-family:"PingFang SC";src:local("PingFang SC");font-weight:100 900;}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:#faf8ef;font-family:'PingFang SC',sans-serif;color:#303e37}#film{position:relative;width:1080px;height:1440px;overflow:hidden}.scene{position:absolute;inset:0;background:#faf8ef;opacity:0;overflow:hidden}.scene:first-child{opacity:1}.content{width:100%;height:100%;padding:100px 80px 120px;display:flex;flex-direction:column;gap:30px;position:relative;z-index:2}.eyebrow{font-size:26px;color:#657650;letter-spacing:3px}h1,h2,p{margin:0}h1,h2{font-size:88px;letter-spacing:-3px;line-height:1.23;font-weight:700;max-width:920px}.red{color:#de5548}.green{color:#6c8759}.sub{font-size:37px;line-height:1.55;max-width:900px}.fine{font-size:23px;color:#657650;line-height:1.6}.ambient{position:absolute;width:820px;height:820px;border-radius:50%;background:#f8eabc;right:-120px;top:490px;z-index:0}.ambient.ring{background:none;border:2px solid #e3dec6;width:940px;height:940px;top:455px;right:-180px}.artbox{height:670px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}.artbox img{height:660px;width:660px;object-fit:contain}.brand{display:flex;align-items:center;gap:16px}.ball{width:30px;height:30px;border:3px solid #303e37;border-radius:50%;background:linear-gradient(#de5548 0 45%,#303e37 45% 57%,#faf8ef 57%);display:inline-block}.ribbon{background:#eef2e3;border:1px solid #dce4d0;padding:23px 30px;border-radius:24px;font-size:34px;line-height:1.55}.ribbon b{color:#55723c}.stamp{font-size:27px;color:#786731;border:1px solid #ccb678;border-radius:30px;padding:12px 24px;width:fit-content}.screenshot{width:920px;max-width:100%;border-radius:28px;border:2px solid #e1e5d8;box-shadow:0 18px 28px #303e3710}.form{margin:24px 0 15px}.quote{font-size:42px;line-height:1.55;background:#eef2e3;padding:30px 36px;border-radius:23px}.ticket{display:flex;justify-content:space-between;align-items:center;border:2px dashed #c8b36d;background:#fff5d7;border-radius:25px;padding:26px 34px;font-size:32px}.ticket .digits{font-size:47px;letter-spacing:7px;color:#89723a;font-variant-numeric:tabular-nums}.s3 .artbox{height:530px}.s3 .artbox img{height:510px;width:510px}.spark{position:absolute;color:#907329;font-size:74px}.spark.a{left:80px;top:220px}.spark.b{right:60px;top:160px;font-size:50px}.pokemon-name{font-size:47px;text-align:center;font-weight:600}.memory{padding:32px 24px;background:#eef2e3;border-radius:28px}.memory img{display:block;width:100%;border-radius:20px}.memory-label{font-size:30px;margin-bottom:22px;color:#61734d}.s4 .content{gap:44px}.s4 .memory{margin-top:45px}.promise{font-size:55px;line-height:1.5;max-width:850px;margin-top:35px}.miniart{width:260px;align-self:flex-end}.s5 .content{gap:24px}.s5 h2{font-size:78px}.device{padding:16px;background:#303e37;border-radius:34px;margin:20px 0 10px;transform:rotate(-2deg)}.device img{display:block;width:100%;border-radius:21px}.url{font-size:43px;font-weight:650;letter-spacing:-1px}.cta{font-size:34px;color:#55723c}.s5 .sub{font-size:30px}.watermark{position:absolute;left:80px;right:80px;bottom:52px;z-index:20;display:flex;justify-content:space-between;font-size:21px;color:#657650}.line{position:absolute;bottom:93px;left:80px;width:920px;height:3px;background:#e3e6d9;z-index:20}.progress{width:100%;height:100%;background:#8fa273;transform-origin:left}
h1 > span,h2 > span.red:not(:only-child),#s2 h2 > span{display:block}#s3 h2 span.red{display:inline}h1{font-size:79px}#s5 h2 span{display:block}#s3 .content{padding-top:65px;gap:23px}#s3 h2{font-size:70px}.gallery-window{height:910px;width:920px;overflow:hidden;border-radius:25px;border:1px solid #dce4d0;flex-shrink:0;background:#f5f6f3}.gallery-window img{display:block;width:920px;height:auto;max-width:none}#s3 .fine{font-size:25px}#s5 .device{width:780px;align-self:center;margin:4px 0}#s5 .content{gap:18px;padding-top:75px}#s5 h2{font-size:70px}#s5 .sub{font-size:27px}</style></head><body><div id="film" data-composition-id="kanto-film" data-start="0" data-duration="18" data-width="1080" data-height="1440">
<section class="scene s1" id="s1"><div class="ambient" data-layout-ignore></div><div class="ambient ring" data-layout-ignore></div><div class="content"><div class="eyebrow brand"><span class="ball"></span>KANTO 151 · 关都冒险手帐</div><h1>把孩子的成长，<span class="red">变成一次宝可梦相遇。</span></h1><div class="artbox"><img src="assets/pikachu.png"></div><div class="stamp">宝可梦 30 周年 · 我的童年，陪他长大</div></div></section>
<section class="scene s2" id="s2"><div class="ambient" data-layout-ignore></div><div class="content"><div class="eyebrow">看见努力 · 送出鼓励</div><h2>今天的努力，<span class="green">我看见了。</span></h2><div class="quote">“遇到难题没有放弃，<br>又认真试了一次。”</div><img class="screenshot form" src="assets/reward-form.png"><div class="ribbon">写下具体的理由，<b>送出一张奖励券。</b></div></div></section>
<section class="scene s3" id="s3"><div class="content"><div class="eyebrow">从妙蛙种子，到梦幻 · 完整图鉴演示</div><h2>最初的 <span class="red">151</span>，<br>陪他慢慢收集。</h2><div class="gallery-window"><img data-layout-allow-overflow id="gallery" src="assets/gallery-video.png"></div><p class="fine">每一位伙伴，都可以留下一个成长的理由。</p></div></section>
<section class="scene s5" id="s5"><div class="ambient" data-layout-ignore></div><div class="content"><div class="eyebrow brand"><span class="ball"></span>KANTO 151</div><h2>我的童年，<span class="red">他的关都冒险。</span></h2><div class="device"><img src="assets/home.png"></div><p class="url">pokemon.yibuu.com/demo</p><p class="cta">iPad 横屏 · 开启语音体验</p><p class="sub">演示版使用模拟数据<br>暂不能创建自己的家庭</p></div></section>

window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});
const scenes=[['s1',0],['s2',2.5],['s3',5.4],['s5',14.5]];
scenes.forEach(([id,start],i)=>{
 if(i){tl.to('#'+scenes[i-1][0],{opacity:0,duration:.45,ease:'sine.inOut'},start);tl.to('#'+id,{opacity:1,duration:.45,ease:'sine.inOut'},start);}
 const elements=document.querySelectorAll('#'+id+' .content > *');
 elements.forEach((el,j)=>{const ease=['power3.out','sine.out','back.out(1.1)'][j%3];tl.from(el,{y:j===0?10:28,opacity:0,scale:j===2?.96:1,duration:.5,ease},start+.12+j*.075);});
 if(id!=='s3') tl.from('#'+id+' .ambient',{scale:.95,opacity:.5,duration:1,ease:'sine.out'},start);
 if(id!=='s3') tl.to('#'+id+' .ambient',{x:-18,y:-12,duration:3.6,ease:'sine.inOut'},start+.3);
});
tl.to('#s1 .artbox img',{y:-18,rotation:3,duration:2.4,ease:'sine.inOut'},.9);
tl.to('#gallery',{y:-7277.0633,duration:7.7,ease:'none'},6.25);
tl.from('.watermark',{opacity:0,duration:.5,ease:'sine.out'},.2);
tl.from('.line',{opacity:0,duration:.5,ease:'sine.out'},.2);
tl.from('.progress',{scaleX:0,duration:18,ease:'none'},0);
window.__timelines['kanto-film']=tl;
</script></body></html>
